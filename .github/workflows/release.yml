name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: microsoft/apm-action@v1
        with:
          mode: release
          apm-version: "0.33.0"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
